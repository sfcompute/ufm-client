[package]
name = "ufm-client"
version = "0.1.0"
edition = "2021"
authors = ["SF Compute"]
description = "A Rust client library for NVIDIA's Unified Fabric Manager (UFM) REST API"
license = "MIT OR Apache-2.0"
keywords = ["nvidia", "ufm", "infiniband", "fabric", "pkey"]
categories = ["api-bindings", "network-programming"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Utilities
url = "2"
secrecy = { version = "0.10", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
wiremock = "0.6"
claims = "0.8"
once_cell = "1"
pretty_assertions = "1"
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[features]
default = []
# Enable integration tests against a real UFM instance
integration-tests = []
